map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3405;
    server_name _;

    client_max_body_size 1100m;

    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ $uri/index.html /index.html; }
    location /hub/ { try_files $uri $uri/ /hub/index.html; }
    location /atualizacao/ { try_files $uri $uri/ /atualizacao/index.html; }

    location /downloads/ {
        alias /data/packages/;
        autoindex off;
        location ~ /\. { deny all; }
    }

    location /api/v1/live {
        proxy_pass http://backend:3333;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location ~ ^/(api/|docs/|api-docs\.json$|health$) {
        proxy_pass http://backend:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }

    # API publica do Hub (usada pelos ERPs): /hub-api/x -> hub-api:4000/x
    location /hub-api/ {
        proxy_pass http://hub-api:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
