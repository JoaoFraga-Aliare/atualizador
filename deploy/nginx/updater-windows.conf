# Central de Atualizacao - Nginx no Windows
# Ajuste server_name, certificados e o caminho de instalacao (padrao C:/UpdaterCentral).
# Inclua este arquivo dentro do bloco http do nginx.conf.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name atualizacao.exemplo.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name atualizacao.exemplo.com.br;

    ssl_certificate     C:/UpdaterCentral/certs/fullchain.pem;
    ssl_certificate_key C:/UpdaterCentral/certs/privkey.pem;

    # Pacotes de ate 1 GB (mesmo limite do backend).
    client_max_body_size 1100m;

    # Painel (exportacao estatica do Next).
    root C:/UpdaterCentral/frontend;
    index index.html;
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # Pacotes publicados. Pastas internas (.incoming, .temp) nunca sao servidas.
    # Backups de banco NAO ficam aqui: eles estao em DATABASE_BACKUPS_PATH, fora desta pasta.
    location /downloads/ {
        alias C:/UpdaterCentral/packages/;
        autoindex off;
        location ~ /\. { deny all; }
    }

    # Canal ao vivo dos terminais (WebSocket).
    location /api/v1/live {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # API, Swagger e health check. Host e X-Forwarded-* sao usados pelo limite de
    # tentativas (IP real), pelo cookie Secure e pela checagem de origem do painel.
    location ~ ^/(api/|docs/|api-docs\.json$|health$) {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }
}
