# Desenvolvimento local. Em produção (VPS) usar segredos reais e TLS na frente (reverse proxy).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hub_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: hub
      HUB_APP_PASSWORD: ${HUB_APP_PASSWORD:?defina no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hub_pgdata:/var/lib/postgresql/data
      - ./docker/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub_owner -d hub"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  hub_pgdata:
